<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação de Orçamento</title>
  <script>
    if (decodeURI(window.location.pathname) === "/solicitacao-orcamento") {
      window.location.replace("/solicitacao-orcamento/" + window.location.search + window.location.hash);
    }
  </script>
  <link rel="stylesheet" href="./style.css?v=4">
  <script defer src="./main.js?v=4"></script>
</head>
<body>
  <main class="page">
    <img class="brand-logo" src="./img/LOGO_MACHADO.png" alt="Machado" width="1871" height="567" draggable="false">

    <form class="quote-form" id="quote-form" action="#" method="post" novalidate>
      <div class="form-content">
        <header class="form-header">
          <h1>Solicitação de Orçamento:</h1>
          <p>Solução em Método Gerencial</p>
        </header>

        <div class="form-card">
          <fieldset class="form-section">
            <legend>Seus dados:</legend>

            <div class="field">
              <label for="full-name">Nome Completo*</label>
              <input class="text-input" id="full-name" name="full-name" type="text" autocomplete="name" autocapitalize="words" placeholder="Digite seu nome completo" required>
            </div>

            <div class="field">
              <label for="email">E-mail*</label>
              <input class="text-input" id="email" name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="Digite seu e-mail" required>
            </div>

            <div class="field">
              <label for="email-confirm">Confirmação E-mail*</label>
              <input class="text-input" id="email-confirm" name="email-confirm" type="email" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="email-mismatch-warning" placeholder="Confirme seu e-mail" required>
              <p class="field-warning" id="email-mismatch-warning" role="alert" hidden>⮾ E-mails divergentes.</p>
            </div>

            <div class="field">
              <label for="phone">Telefone com DDD*</label>
              <input class="text-input" id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel-national" maxlength="15" placeholder="(11) 99999-9999" required>
            </div>

            <div class="field">
              <label for="role">Cargo*</label>
              <input class="text-input" id="role" name="role" type="text" autocomplete="organization-title" autocapitalize="words" placeholder="Digite seu cargo" required>
            </div>
          </fieldset>

          <fieldset class="form-section form-section--company">
            <legend>Dados da Empresa:</legend>

            <div class="field">
              <label for="company-name">Nome da Empresa*</label>
              <input class="text-input" id="company-name" name="company-name" type="text" autocomplete="organization" placeholder="Digite o nome da empresa" required>
            </div>

            <div class="field">
              <label for="company-cnpj">CNPJ*</label>
              <input class="text-input" id="company-cnpj" name="company-cnpj" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="18" placeholder="Digite o CNPJ" required>
            </div>

            <div class="field">
              <label for="participant-count">Número aproximado de funcionários que participarão da Solução*</label>
              <select class="text-input" id="participant-count" name="participant-count" required>
                <option value="" disabled selected hidden>-</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
                <option value="13">13</option>
                <option value="14">14</option>
                <option value="15">15</option>
                <option value="16">16</option>
                <option value="17">17</option>
                <option value="18">18</option>
                <option value="19">19</option>
                <option value="20">20</option>
                <option value=">20">&gt;20</option>
              </select>
            </div>

            <div class="field">
              <label for="notes">Observações</label>
              <textarea class="text-input notes-input" id="notes" name="notes" maxlength="300" rows="6" placeholder="Digite suas observações"></textarea>
            </div>
          </fieldset>

          <button class="submit-button" id="submit-button" type="submit">
            <span id="submit-label">SOLICITAR ORÇAMENTO</span>
          </button>
        </div>
      </div>

      <section class="form-success" id="form-success" role="status" aria-live="polite" aria-atomic="true" tabindex="-1">
        <h2>Solicitação enviada com sucesso!</h2>
        <p>Basta aguardar. Logo entraremos em contato.</p>
      </section>
    </form>

    <p class="visually-hidden" id="submission-status" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>
</body>
</html>
