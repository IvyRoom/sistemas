<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Atendimentos | Machado</title>
  <script src="/support-management/modules/canonical.js"></script>
  <link rel="icon" href="../img/FAVICON.ico">
  <link rel="stylesheet" href="../style.css">
  <script type="module" src="./main.js"></script>
</head>
<body class="login-page">
  <main class="login-layout">
    <img class="logo" src="../img/LOGO_MACHADO.png" alt="Machado">
    <section class="login-panel" aria-labelledby="welcome">
      <p class="eyebrow">Atendimentos consultivos</p>
      <h1 id="welcome">Seja bem-vindo!</h1>
      <p class="sandbox-label">Ambiente de testes</p>
      <form id="login-form" aria-busy="false">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="username" maxlength="254" required aria-describedby="login-message">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required aria-describedby="login-message">
        <button class="primary login-submit" id="login-submit" type="submit" disabled>Entrar</button>
        <p class="message" id="login-message" role="status" aria-live="polite">Verificando o ambiente de testes...</p>
      </form>
    </section>
    <footer>Machado | Método Gerencial para Empresas® — Todos os direitos reservados.</footer>
  </main>
</body>
</html>
