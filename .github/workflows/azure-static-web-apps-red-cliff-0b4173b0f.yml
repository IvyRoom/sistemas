name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.agents/**'
      - '.github/dependabot.yml'
      - '.github/workflows/browser-dependency-version-check.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions: {}

# Uploads and closure share a PR key even when a merged close event uses main.
concurrency:
  group: swa-deployment-${{ github.event.pull_request.number || github.ref }}
  queue: max # Retain pending cleanup when another event arrives.
  cancel-in-progress: false

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # The SWA action posts the preview link.
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          lfs: false
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Test frontend applications
        run: node --test .agents/tests/*.test.js
      - name: Test deployment contract
        run: node --test scripts/frontend-deployment.test.mjs
      - name: Build frontend artifact
        run: node scripts/build-frontend.mjs
      - name: Validate frontend artifact
        run: node scripts/check-frontend.mjs
      - name: Retain frontend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: true
      - name: Check current pull request state
        if: github.event_name == 'pull_request'
        id: preview_state
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.state')"
          case "$state" in
            open|closed) echo "state=$state" >> "$GITHUB_OUTPUT" ;;
            *) echo 'Unexpected pull request state.' >&2; exit 1 ;;
          esac
      - name: Build And Deploy
        if: github.event_name == 'push' || steps.preview_state.outputs.state == 'open'
        id: builddeploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_CLIFF_0B4173B0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "dist" # Prebuilt app content path
          api_location: "" # Api source code path - optional
          output_location: ""
          skip_app_build: true
          ###### End of Repository/Build Configurations ######
      - name: Validate Azure preview
        if: github.event_name == 'pull_request' && steps.preview_state.outputs.state == 'open'
        env:
          PREVIEW_URL: ${{ steps.builddeploy.outputs.static_web_app_url }}
        run: node scripts/check-deployment.mjs --base-url "$PREVIEW_URL"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
    name: Close Pull Request Job
    steps:
      - name: Check current pull request state
        id: preview_state
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.state')"
          case "$state" in
            open|closed) echo "state=$state" >> "$GITHUB_OUTPUT" ;;
            *) echo 'Unexpected pull request state.' >&2; exit 1 ;;
          esac
      - name: Close Pull Request
        if: steps.preview_state.outputs.state == 'closed'
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_CLIFF_0B4173B0F }}
          action: "close"
