name: Validate Dependabot updates

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: dependabot-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    name: Validate dependency update
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Test frontend applications
        run: node --test .agents/tests/*.test.js
      - name: Test deployment contract
        run: node --test scripts/frontend-deployment.test.mjs
      - name: Build frontend artifact
        run: node scripts/build-frontend.mjs
      - name: Validate frontend artifact
        run: node scripts/check-frontend.mjs
